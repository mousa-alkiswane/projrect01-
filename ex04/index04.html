<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
</head>

<body>
<form>


<label for="fullname">Full name </label>
<input   type = "text"  id="fullname" required minlength="4" > 
<br>
<label for="email"> email </label>
<input type="email" id="email" required >
<br>
<label for = pass > password    </label>
<input  type="password" id="pass" required minlength="8">
<br>
<label for="student"> student </label>
<input  id = "student" type="radio"  name="role" value="student" >
<br>
<label for="professional">Professional</label>
<input type="radio" id="professional" name="role" value="professional">
<br>
<label for="agreement">I agree to the terms</label>
<input type="checkbox" id="agreement" required> 

<br>
<label for="country">Country</label>
<select id="country" required>
    <option>Jordan</option>
    <option>Saudi Arabia</option>
    <option>Egypt</option>
</select>
<br>
<br>
<br>
<label for="message">Message</label>
<textarea id="message" required minlength="10"></textarea>
<br>
<br>
<button type="submit">Register</button> 


</form>




</body>







</html>
